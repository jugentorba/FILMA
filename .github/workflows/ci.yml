name: FILMA CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: filma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: TypeScript
        run: yarn typecheck

      - name: Expo config
        run: npx expo config --type public

      - name: Expo doctor
        run: yarn doctor

      - name: Mobile Android prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Android TV prebuild
        run: EXPO_TV=1 npx expo prebuild --platform android --clean --no-install

      - name: Mobile iOS prebuild
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Apple TV prebuild
        run: EXPO_TV=1 npx expo prebuild --platform ios --clean --no-install
