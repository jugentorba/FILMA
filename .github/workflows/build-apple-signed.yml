name: FILMA Signed Apple Device Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apple-signed.yml'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'yarn.lock'
      - 'src/**'
      - 'modules/**'

concurrency:
  group: filma-apple-signed-build
  cancel-in-progress: true

jobs:
  signed-apple-devices:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_EXPORT_METHOD: ${{ secrets.APPLE_EXPORT_METHOD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect available signing credentials
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          ios=false
          tvos=false
          if [ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            ios=true
          fi
          if [ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${TVOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            tvos=true
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "tvos=$tvos" >> "$GITHUB_OUTPUT"
          if [ "$ios" != true ] && [ "$tvos" != true ]; then
            echo 'Apple signing secrets are not configured yet; signed device builds are skipped cleanly.'
          fi

      - name: Setup Node
        if: steps.signing.outputs.ios == 'true' || steps.signing.outputs.tvos == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Select Xcode 26.6
        if: steps.signing.outputs.ios == 'true' || steps.signing.outputs.tvos == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install locked dependencies
        if: steps.signing.outputs.ios == 'true' || steps.signing.outputs.tvos == 'true'
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install signing certificate
        if: steps.signing.outputs.ios == 'true' || steps.signing.outputs.tvos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/filma-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/filma-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/filma-signing.p12" -k "$KEYCHAIN_PATH" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "FILMA_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install iOS provisioning profile
        id: ios_profile
        if: steps.signing.outputs.ios == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$RUNNER_TEMP/FILMA-iOS.mobileprovision"
          plist="$RUNNER_TEMP/FILMA-iOS-profile.plist"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Generate signed iPhone/iPad project
        if: steps.signing.outputs.ios == 'true'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install iOS pods
        if: steps.signing.outputs.ios == 'true'
        run: cd ios && pod install

      - name: Archive signed iPhone/iPad app
        if: steps.signing.outputs.ios == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          xcodebuild \
            -workspace "$workspace" \
            -scheme FILMA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FILMA-iOS.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.ios_profile.outputs.name }}" \
            archive

      - name: Export signed iPhone/iPad IPA
        if: steps.signing.outputs.ios == 'true'
        shell: bash
        run: |
          set -euo pipefail
          method="${APPLE_EXPORT_METHOD:-development}"
          profile_name='${{ steps.ios_profile.outputs.name }}'
          cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$method</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jugentorba.filma</key><string>$profile_name</string>
            </dict>
          </dict>
          </plist>
          PLIST
          rm -rf "$RUNNER_TEMP/FILMA-iOS-export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FILMA-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/FILMA-iOS-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist"
          ipa=$(find "$RUNNER_TEMP/FILMA-iOS-export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$ipa"
          cp "$ipa" FILMA-iOS-Signed.ipa

      - name: Upload signed iPhone/iPad IPA
        if: steps.signing.outputs.ios == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FILMA-iOS-Signed-IPA
          path: FILMA-iOS-Signed.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Install tvOS provisioning profile
        id: tvos_profile
        if: steps.signing.outputs.tvos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$RUNNER_TEMP/FILMA-tvOS.mobileprovision"
          plist="$RUNNER_TEMP/FILMA-tvOS-profile.plist"
          printf '%s' "$TVOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Generate signed Apple TV project
        if: steps.signing.outputs.tvos == 'true'
        run: EXPO_TV=1 npx expo prebuild --platform ios --clean --no-install

      - name: Install tvOS pods
        if: steps.signing.outputs.tvos == 'true'
        run: cd ios && pod install
        env:
          EXPO_TV: '1'

      - name: Archive signed Apple TV app
        if: steps.signing.outputs.tvos == 'true'
        shell: bash
        env:
          EXPO_TV: '1'
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          xcodebuild \
            -workspace "$workspace" \
            -scheme FILMA \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/FILMA-tvOS.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.tvos_profile.outputs.name }}" \
            archive

      - name: Export signed Apple TV IPA
        if: steps.signing.outputs.tvos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          method="${APPLE_EXPORT_METHOD:-development}"
          profile_name='${{ steps.tvos_profile.outputs.name }}'
          cat > "$RUNNER_TEMP/ExportOptions-tvOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$method</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jugentorba.filma</key><string>$profile_name</string>
            </dict>
          </dict>
          </plist>
          PLIST
          rm -rf "$RUNNER_TEMP/FILMA-tvOS-export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FILMA-tvOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/FILMA-tvOS-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-tvOS.plist"
          ipa=$(find "$RUNNER_TEMP/FILMA-tvOS-export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$ipa"
          cp "$ipa" FILMA-Apple-TV-Signed.ipa

      - name: Upload signed Apple TV IPA
        if: steps.signing.outputs.tvos == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FILMA-Apple-TV-Signed-IPA
          path: FILMA-Apple-TV-Signed.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${FILMA_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$FILMA_KEYCHAIN_PATH" || true
          fi
