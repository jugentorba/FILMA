name: FILMA Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main, filma-next-cleanup]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'app.json'
      - 'index.ts'
      - '.github/workflows/build-android.yml'

concurrency:
  group: filma-android-build
  cancel-in-progress: true

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FILMA_TEST_KEYSTORE: ${{ github.workspace }}/.ci-signing/filma-test.keystore
      FILMA_TEST_KEY_ALIAS: filma-test
      FILMA_TEST_KEY_PASSWORD: filma-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent FILMA test signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/filma-test.keystore
          key: filma-android-test-signing-v1

      - name: Ensure FILMA test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FILMA_TEST_KEYSTORE")"
          if [ ! -f "$FILMA_TEST_KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$FILMA_TEST_KEYSTORE" \
              -storepass "$FILMA_TEST_KEY_PASSWORD" \
              -keypass "$FILMA_TEST_KEY_PASSWORD" \
              -alias "$FILMA_TEST_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname 'CN=FILMA Test,O=FILMA,C=FR'
          fi
          keytool -list \
            -keystore "$FILMA_TEST_KEYSTORE" \
            -storepass "$FILMA_TEST_KEY_PASSWORD" \
            -alias "$FILMA_TEST_KEY_ALIAS"

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Verify resolved native versions
        run: yarn list --pattern 'react-native|expo-modules-autolinking|expo-modules-core|^expo$' --depth=2

      - name: Generate mobile Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify Expo SDK 57 Gradle wrapper
        run: |
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-9.3.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build mobile release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign and verify mobile APK
        shell: bash
        run: |
          set -euo pipefail
          input='android/app/build/outputs/apk/release/app-release.apk'
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          "$build_tools/zipalign" -f -p 4 "$input" FILMA-mobile-aligned.apk
          "$build_tools/apksigner" sign \
            --ks "$FILMA_TEST_KEYSTORE" \
            --ks-key-alias "$FILMA_TEST_KEY_ALIAS" \
            --ks-pass "pass:$FILMA_TEST_KEY_PASSWORD" \
            --key-pass "pass:$FILMA_TEST_KEY_PASSWORD" \
            --out FILMA-mobile.apk \
            FILMA-mobile-aligned.apk
          rm FILMA-mobile-aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs FILMA-mobile.apk
          sha256sum FILMA-mobile.apk > FILMA-mobile.apk.sha256

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: FILMA-mobile-APK
          path: |
            FILMA-mobile.apk
            FILMA-mobile.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Generate Android TV project
        run: EXPO_TV=1 npx expo prebuild --platform android --clean --no-install

      - name: Verify Expo SDK 57 TV Gradle wrapper
        run: |
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-9.3.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android TV release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign and verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          input='android/app/build/outputs/apk/release/app-release.apk'
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          "$build_tools/zipalign" -f -p 4 "$input" FILMA-android-tv-aligned.apk
          "$build_tools/apksigner" sign \
            --ks "$FILMA_TEST_KEYSTORE" \
            --ks-key-alias "$FILMA_TEST_KEY_ALIAS" \
            --ks-pass "pass:$FILMA_TEST_KEY_PASSWORD" \
            --key-pass "pass:$FILMA_TEST_KEY_PASSWORD" \
            --out FILMA-android-tv.apk \
            FILMA-android-tv-aligned.apk
          rm FILMA-android-tv-aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs FILMA-android-tv.apk
          sha256sum FILMA-android-tv.apk > FILMA-android-tv.apk.sha256

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: FILMA-Android-TV-APK
          path: |
            FILMA-android-tv.apk
            FILMA-android-tv.apk.sha256
          if-no-files-found: error
          retention-days: 30
