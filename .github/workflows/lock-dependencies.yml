name: Lock FILMA Dependencies

on:
  push:
    paths:
      - 'package.json'
      - '.github/workflows/lock-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Generate Yarn lockfile
        run: yarn install --non-interactive

      - name: Commit lockfile when changed
        run: |
          if [ ! -f yarn.lock ]; then
            echo 'yarn.lock was not generated.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yarn.lock
          if git diff --cached --quiet; then
            echo 'yarn.lock already matches the dependency graph.'
            exit 0
          fi
          git commit -m 'Update Yarn dependency lockfile'
          git push
